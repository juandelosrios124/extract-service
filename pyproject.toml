[project]
name = "extract-service"
version = "0.1.0"
description = "Microservicio sin estado de extracción de texto de PDFs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "pymupdf>=1.27.2.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
