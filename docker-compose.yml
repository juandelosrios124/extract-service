# Imagen (12-Factor V): este archivo usa la imagen que publica la CI en GHCR,
# sin "build". docker-compose.override.yml, que Compose lee solo, le agrega el
# build local para desarrollo (y para "make up" de infra). Release, sin
# compilar (ver README, "Imagen y releases"):
#
#   EXTRACT_IMAGE_TAG=sha-xxxxxxx docker compose -f docker-compose.yml up -d --wait

services:
  # Sin "ports": varias replicas no pueden publicar el mismo puerto del host, y
  # el acceso entra por Traefik desde la red mired.
  extract:
    # La imagen construida una sola vez por la CI. Vacio o "latest" en
    # desarrollo; un sha-xxxxxxx o vX.Y.Z para una release reproducible.
    # Sin pull_policy (default "missing"): un sha-/vX.Y.Z es inmutable, asi que
    # bajarlo una vez alcanza y no hace falta ir al registro en cada "up".
    # "always" ademas pasaria al override y haria que el desarrollo intente
    # bajar extract-service:dev de Docker Hub. Para refrescar "latest":
    # docker compose -f docker-compose.yml pull extract
    image: ghcr.io/juandelosrios124/extract-service:${EXTRACT_IMAGE_TAG:-latest}
    expose:
      - "8001"
    networks:
      # Unica red: la externa compartida con Consul, Traefik y
      # documents-service (issues #18 y #33). Traefik llega a cada replica por
      # aca, asi que la red del proyecto ya no hace falta.
      mired:
        aliases:
          - extract-service
    environment:
      PORT: 8001
      MAX_UPLOAD_SIZE: ${EXTRACT_MAX_UPLOAD_SIZE:-52428800}
      THREAD_POOL_SIZE: ${EXTRACT_THREAD_POOL_SIZE:-1}
      LOG_LEVEL: ${EXTRACT_LOG_LEVEL:-INFO}
      LOG_FORMAT: ${EXTRACT_LOG_FORMAT:-json}
      # Backpressure y limites de la extraccion: las lee la app. Los 5 + 15 + 8
      # son el tramo de extract del presupuesto de timeouts de punta a punta
      # (cliente 30 s > documents 27 s > Traefik 25 s > extract 23 s), issue #34.
      MAX_QUEUE_WAIT: ${EXTRACT_MAX_QUEUE_WAIT:-15}
      MAX_CONCURRENT_UPLOADS: ${EXTRACT_MAX_CONCURRENT_UPLOADS:-8}
      UPLOAD_SLOT_TIMEOUT: ${EXTRACT_UPLOAD_SLOT_TIMEOUT:-5}
      EXTRACTION_DEADLINE: ${EXTRACT_EXTRACTION_DEADLINE:-8}
      MAX_PAGES: ${EXTRACT_MAX_PAGES:-10000}
      # Readiness (issue #35): tiene que ser mayor que EXTRACTION_DEADLINE.
      READINESS_STUCK_AFTER: ${EXTRACT_READINESS_STUCK_AFTER:-12}
      # Service discovery (issue #16). Encendido por defecto desde la #32:
      # Traefik descubre las replicas por el catalogo de Consul. Si Consul no
      # esta, el registro falla con un WARNING y la replica arranca igual. El
      # token sale del .env, nunca del repo.
      CONSUL_ENABLED: ${CONSUL_ENABLED:-true}
      CONSUL_HTTP_ADDR: ${CONSUL_HTTP_ADDR:-http://consul:8500}
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:-}
      # Tags con los que Traefik publica el servicio (issue #32). El breaker
      # cuenta [500, 503): el 503 del backpressure no abre el circuito.
      TRAEFIK_CB_EXPRESSION: "${TRAEFIK_CB_EXPRESSION:-NetworkErrorRatio() > 0.30 || ResponseCodeRatio(500, 503, 0, 600) > 0.50}"
      TRAEFIK_CB_FALLBACK: ${TRAEFIK_CB_FALLBACK:-10s}
      TRAEFIK_CB_RECOVERY: ${TRAEFIK_CB_RECOVERY:-10s}
      # Retry solo ante error de red antes de mandar el pedido (POST incluido);
      # no reintenta respuestas ni el 504 por timeout (issue #55).
      TRAEFIK_RETRY_ATTEMPTS: ${TRAEFIK_RETRY_ATTEMPTS:-2}
      TRAEFIK_INFLIGHT: ${TRAEFIK_INFLIGHT:-80}
      # Un unico tope de pedidos en vuelo: Traefik pisa X-Forwarded-Server con
      # su hostname. Vacio = un tope por cada Host (default de Traefik).
      TRAEFIK_INFLIGHT_SOURCE_HEADER: ${TRAEFIK_INFLIGHT_SOURCE_HEADER-X-Forwarded-Server}
    deploy:
      replicas: ${EXTRACT_REPLICAS:-5}
      resources:
        limits:
          cpus: "${EXTRACT_CPUS:-1.0}"
          memory: ${EXTRACT_MEMORY:-1g}
    # Apagado prolijo (12-Factor IX, issue #72). Un pedido puede durar hasta
    # 23 s y uvicorn los espera hasta SHUTDOWN_TIMEOUT (25 s): Docker tiene que
    # esperar mas antes del SIGKILL (el default es 10 s), o corta pedidos y la
    # replica no llega a desregistrarse de Consul.
    stop_grace_period: 30s

# El punto de entrada es Traefik, que vive en el repo de infra y descubre las
# replicas por el catalogo de Consul (issues #32 y #33). Este compose no
# publica ningun puerto: sin infra levantada, el servicio no se alcanza.
networks:
  # Externa y compartida por los tres repos. Se crea una sola vez por maquina:
  #   docker network create mired
  mired:
    name: ${SHARED_NETWORK:-mired}
    external: true
